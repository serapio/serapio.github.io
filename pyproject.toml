[project]
name = "serapio-github-io"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "html5lib>=1.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "markdown>=3.11.3",
    "markdownify>=1.2.3",
    "odfpy>=1.4.1",
    "pypandoc-binary>=1.17",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "html5validator>=0.4.2",
    "playwright>=1.64.1",
    "pytest<9",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.4",
]
